name: Release

# Builds a signed release APK and publishes it as a new GitHub Release
# every time a normal push lands on main. The version-bump commit this
# workflow makes includes "[skip ci]", which GitHub uses to skip the run
# it would otherwise trigger — so it bumps once per real push, not twice.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: book-companion-release
  cancel-in-progress: false

env:
  APP_NAME: "Book Companion"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version in pubspec.yaml
        id: bump
        run: |
          CURRENT=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          BASE="${CURRENT%%+*}"
          BUILD="${CURRENT##*+}"
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_BUILD=$((BUILD + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0+${NEW_BUILD}"
          TAG="v${MAJOR}.${NEW_MINOR}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The keystore and its passwords never live in the repo — only a
      # base64 copy sits in encrypted GitHub secrets. See README.md
      # ("Signing key") for how these secrets were created.
      - name: Decode signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > book_companion_release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../../book_companion_release.keystore
          EOF

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Write changelog and checksums
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            git log "$PREVIOUS..HEAD" --no-merges --pretty=format:'- %s' --invert-grep --grep='\[skip ci\]' > "$RUNNER_TEMP/release-notes.md"
          else
            git log --no-merges --pretty=format:'- %s' --invert-grep --grep='\[skip ci\]' > "$RUNNER_TEMP/release-notes.md"
          fi
          cd build/app/outputs/flutter-apk
          sha256sum app-*-release.apk > SHA256SUMS

      - name: Commit successful version bump
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.tag }} [skip ci]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: "${{ env.APP_NAME }} ${{ steps.bump.outputs.tag }}"
          target_commitish: main
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS
