name: book_companion
description: Personal Android book tracker. Data lives on-device only.
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2           # simple state management for the library model
  path_provider: ^2.1.2      # find on-device app storage folder
  file_picker: ^8.0.0        # pick a JSON file to import, or a folder to export to
  image_picker: ^1.1.1       # pick a cover image from gallery
  intl: ^0.19.0              # date formatting
  uuid: ^4.4.0                # generate ids for books/sessions

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  # Adaptive layers, so every Android 8+ launcher masks the icon itself
  # instead of shrinking a square PNG onto a white plate — which is what
  # Motorola, Pixel, Samsung and OnePlus all did with the old config.
  # The layers are generated from assets/icon/app_icon.jpg by
  # tool/make_icons.py; regenerate them if the source art changes.
  image_path: "assets/icon/app_icon_legacy.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  min_sdk_android: 21
